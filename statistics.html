<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1f3b" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="elite-ui.css" />
    <title>Elite Class - Статистика</title>
  </head>
  <body class="elite-bg">
    <main class="container elite-shell">
      <div class="dash-head">
        <div>
          <h1 class="dash-hello"><i class="bi bi-graph-up-arrow me-2"></i>Статистика</h1>
          <div class="dash-sub" id="stats-sub">Напредък по оценки и присъствия.</div>
        </div>
      </div>

      <p class="msg small mb-0 mt-2" id="msg"></p>

      <!-- Teacher / admin -->
      <div id="teacher-stats" class="hidden">
        <div class="elite-daycard mt-3">
          <div class="elite-daycard-body">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-5">
                <label class="form-label fw-semibold" for="stats-group"><i class="bi bi-people me-1 text-warning"></i>Група</label>
                <select id="stats-group" class="form-select"></select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label fw-semibold" for="stats-from">От дата</label>
                <input id="stats-from" class="form-control" type="date" />
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label fw-semibold" for="stats-to">До дата</label>
                <input id="stats-to" class="form-control" type="date" />
              </div>
              <div class="col-12 col-md-1 d-grid">
                <button class="btn btn-primary" id="stats-reload" type="button" title="Обнови"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div class="stat-row" id="stats-kpis"></div>

        <div class="elite-daycard mt-3">
          <div class="elite-daycard-head">
            <div class="elite-daycard-title"><i class="bi bi-bar-chart-line"></i>Успех по ученици</div>
            <button class="btn btn-sm btn-outline-primary" id="stats-export-all" type="button"><i class="bi bi-download me-1"></i>Свали за групата (CSV)</button>
          </div>
          <div class="elite-daycard-body">
            <div class="mh-table-wrap">
              <table class="mh-table">
                <thead>
                  <tr>
                    <th>Ученик</th>
                    <th>Оценки</th>
                    <th>Среден %</th>
                    <th>Най-нисък / най-висок</th>
                    <th>Отсъствия</th>
                    <th>Репорт</th>
                  </tr>
                </thead>
                <tbody id="stats-rows"><tr><td colspan="6" class="text-muted">Избери група.</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Parent -->
      <div id="parent-stats" class="hidden">
        <div id="parent-children" class="mt-3"></div>
      </div>

      <div id="no-access" class="elite-daycard mt-3 hidden">
        <div class="elite-daycard-body text-center text-muted py-4">
          <i class="bi bi-graph-up fs-3 d-block mb-2"></i>Статистиката е достъпна за учители, администратори и родители.
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./src/stats/statistics.js"></script>
    <script type="module" src="./src/lib/sidebar.js"></script>
  </body>
</html>

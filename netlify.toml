# Ensure the HTML shell is always revalidated so new deploys reach users
# immediately (fingerprinted /assets/* files stay long-cached via their hashed
# names). Prevents the stale "old look" seen from a home-screen shortcut.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
